<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff3f8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>숨겨진 글자를 찾아라!</title>
    <style>
      @font-face {
        font-family: "LovelyBaby";
        src: url("./assets/fonts/lovely-baby.ttf") format("truetype");
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --blue: #f58ab8;
        --blue-dark: #dc6798;
        --blue-soft: #fff0f6;
        --yellow: #fff2ac;
        --red: #ff5f8f;
        --ink: #5d3344;
        --muted: #a06a80;
        --line: #edb3ca;
        --disabled: #ead5dd;
        --panel: #fffafd;
        --shadow: 0 16px 34px rgb(218 104 148 / 18%);
        font-family:
          "LovelyBaby",
          "210 러블리베이비",
          "Malgun Gothic",
          "Apple SD Gothic Neo",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow-x: hidden;
        background:
          linear-gradient(rgb(255 243 248 / 78%), rgb(255 232 241 / 78%)),
          url("./assets/images/princess_gingham_background.png") center / 360px auto repeat;
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      img {
        display: block;
        max-width: 100%;
      }

      .app {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
      }

      .app::before {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          url("./assets/images/theme_strawberry.png"),
          url("./assets/images/theme_cherry.png"),
          url("./assets/images/decor_ribbon.png"),
          url("./assets/images/decor_heart.png");
        background-position:
          5% 8%,
          92% 17%,
          12% 82%,
          88% 88%;
        background-repeat: no-repeat;
        background-size:
          clamp(62px, 13vw, 120px),
          clamp(70px, 14vw, 132px),
          clamp(76px, 16vw, 148px),
          clamp(58px, 12vw, 116px);
        content: "";
        opacity: 0.34;
      }

      .view {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 14px;
        width: 100%;
        min-height: 100svh;
        padding: clamp(12px, 3vw, 26px);
        visibility: hidden;
        opacity: 0;
        transform: translateY(12px) scale(0.985);
        overflow-y: auto;
        transition:
          opacity 240ms ease,
          transform 240ms ease,
          visibility 240ms ease;
        z-index: 1;
      }

      .view.is-active {
        visibility: visible;
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .screen {
        position: relative;
        overflow: hidden;
        width: min(100%, 680px);
        min-height: min(760px, calc(100svh - 24px));
        margin: auto;
        padding: clamp(16px, 4vw, 28px);
        border: 2px solid rgb(241 177 203 / 82%);
        border-radius: 24px;
        background:
          linear-gradient(rgb(255 250 253 / 86%), rgb(255 244 249 / 86%)),
          url("./assets/images/princess_gingham_background.png") center / 360px auto repeat;
        box-shadow: var(--shadow);
      }

      .screen::before {
        position: absolute;
        top: 12px;
        left: 14px;
        right: 14px;
        height: 38px;
        border: 2px solid rgb(241 177 203 / 65%);
        border-radius: 999px;
        background:
          linear-gradient(rgb(255 255 255 / 34%), rgb(255 255 255 / 10%)),
          url("./assets/images/princess_gingham_background.png") center / 160px auto repeat;
        content: "";
        opacity: 0.72;
        pointer-events: none;
        z-index: 0;
      }

      .screen::after {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: clamp(64px, 12vw, 112px);
        aspect-ratio: 1;
        background: url("./assets/images/theme_strawberry.png") center / contain no-repeat;
        content: "";
        opacity: 0.32;
        pointer-events: none;
        z-index: 0;
      }

      .view--play .screen,
      .view--wrong .screen {
        background:
          linear-gradient(rgb(255 250 253 / 86%), rgb(255 244 249 / 86%)),
          url("./assets/images/princess_gingham_background.png") center / 360px auto repeat;
        backdrop-filter: blur(2px);
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
      }

      .topbar__left {
        justify-self: start;
      }

      .topbar__center {
        justify-self: center;
      }

      .topbar__right {
        justify-self: end;
      }

      .title {
        margin: 0;
        text-align: center;
        font-weight: 900;
        line-height: 1.08;
        color: var(--ink);
      }

      .title--main {
        font-size: clamp(42px, 12vw, 80px);
        font-weight: 900;
        letter-spacing: 0;
      }

      .title--blue {
        color: #f667a2;
        -webkit-text-stroke: 0;
        text-shadow: 0 3px 0 rgb(255 255 255 / 90%);
      }

      .title--yellow {
        color: #ff9fbe;
        -webkit-text-stroke: 0;
        text-shadow: 0 3px 0 rgb(255 255 255 / 90%);
      }

      .page-title {
        margin: 0;
        text-align: center;
        font-size: clamp(32px, 8vw, 52px);
        font-weight: 900;
        line-height: 1.1;
        color: var(--ink);
        text-shadow: 0 3px 0 rgb(255 255 255 / 86%);
      }

      .page-title::after {
        display: block;
        width: 120px;
        height: 4px;
        margin: 8px auto 0;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #e982ad 18%, #e982ad 82%, transparent);
        content: "";
      }

      .btn {
        min-height: 44px;
        padding: 8px 18px;
        border: 2px solid #d985a9;
        border-radius: 14px;
        background:
          linear-gradient(#fffafd, #ffe7f0),
          url("./assets/images/princess_gingham_background.png") center / 140px auto repeat;
        color: var(--ink);
        box-shadow: 0 4px 0 rgb(219 116 154 / 28%), inset 0 1px 0 rgb(255 255 255 / 80%);
        font-weight: 900;
        cursor: pointer;
        transition:
          transform 140ms ease,
          box-shadow 140ms ease,
          filter 140ms ease;
      }

      .btn:hover:not(:disabled) {
        filter: brightness(1.03);
        transform: translateY(-1px);
      }

      .btn:active:not(:disabled) {
        box-shadow: 0 1px 0 rgb(219 116 154 / 28%);
        transform: translateY(2px);
      }

      .btn:focus-visible,
      input:focus-visible {
        outline: 4px solid rgb(245 138 184 / 28%);
        outline-offset: 2px;
      }

      .btn--primary {
        border-color: #d86d9d;
        background:
          linear-gradient(#ffb9d3, var(--blue)),
          url("./assets/images/princess_gingham_background.png") center / 130px auto repeat;
        color: #fff;
        box-shadow: 0 5px 0 var(--blue-dark), 0 10px 18px rgb(220 103 152 / 24%);
        text-shadow: 0 1px 0 rgb(138 49 82 / 20%);
      }

      .btn--start {
        min-width: min(280px, 72vw);
        min-height: 68px;
        border-radius: 16px;
        font-size: clamp(26px, 7vw, 42px);
      }

      .btn--submit:disabled,
      .btn:disabled {
        border-color: #d9bdc9;
        background: linear-gradient(#f5e7ed, #ead5dd);
        color: #a98896;
        box-shadow: none;
        cursor: not-allowed;
        text-shadow: none;
      }

      .main-screen {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        align-items: center;
        gap: 24px;
        overflow: hidden;
      }

      .deco-screen > :not(.floating-character):not(.correct-side):not(.wrong-gallery) {
        position: relative;
        z-index: 1;
      }

      .floating-character {
        position: absolute;
        z-index: 0;
        width: clamp(98px, 21vw, 175px);
        pointer-events: none;
        user-select: none;
        filter: drop-shadow(0 8px 10px rgb(166 73 100 / 18%));
      }

      .floating-character--blend {
        mix-blend-mode: multiply;
      }

      .home-character--large {
        width: clamp(182px, 35vw, 322px);
      }

      .home-character--medium {
        width: auto;
        max-width: clamp(147px, 28vw, 259px);
        max-height: clamp(104px, 21vw, 193px);
      }

      .home-float-left-up {
        left: 3%;
        top: 37%;
        animation: driftOne 6.5s ease-in-out infinite;
      }

      .home-float-right-down {
        right: 3%;
        bottom: 26%;
        animation: driftTwo 7.2s ease-in-out infinite;
      }

      .float-a {
        left: 8%;
        top: 18%;
        animation: driftOne 6.5s ease-in-out infinite;
      }

      .float-b {
        right: 12%;
        top: 22%;
        animation: driftTwo 7.2s ease-in-out infinite;
      }

      .float-c {
        left: 24%;
        bottom: 24%;
        animation: driftThree 6.8s ease-in-out infinite;
      }

      .float-d {
        right: 26%;
        bottom: 19%;
        animation: driftOne 7.6s 0.5s ease-in-out infinite;
      }

      .float-e {
        left: 8%;
        bottom: 14%;
        animation: driftTwo 7.1s 0.3s ease-in-out infinite;
      }

      .float-f {
        right: 8%;
        bottom: 33%;
        animation: driftThree 8s 0.2s ease-in-out infinite;
      }

      @keyframes driftOne {
        0%,
        100% {
          transform: translate(0, 0) rotate(-4deg);
        }
        50% {
          transform: translate(18px, -20px) rotate(6deg);
        }
      }

      @keyframes driftTwo {
        0%,
        100% {
          transform: translate(0, 0) rotate(5deg);
        }
        50% {
          transform: translate(-22px, 18px) rotate(-7deg);
        }
      }

      @keyframes driftThree {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(14px, 16px) scale(1.08);
        }
      }

      .magnifier-stage {
        position: relative;
        display: grid;
        min-height: min(42svh, 336px);
        place-items: center;
      }

      .magnifier {
        width: clamp(168px, 42vw, 269px);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 14px 16px rgb(39 72 98 / 20%));
        animation: searchMove 5.5s ease-in-out infinite;
      }

      .magnifier::after {
        content: none;
      }

      @keyframes searchMove {
        0%,
        100% {
          transform: translate(-22px, 6px) rotate(-5deg);
        }
        35% {
          transform: translate(28px, -18px) rotate(6deg);
        }
        70% {
          transform: translate(6px, 24px) rotate(-12deg);
        }
      }

      .description {
        width: min(100%, 500px);
        margin: clamp(18px, 7svh, 58px) auto 0;
        padding-left: 28px;
        font-size: clamp(17px, 3.8vw, 22px);
        font-weight: 800;
        line-height: 1.45;
      }

      .description li {
        margin: 0 0 12px;
      }

      .rules-screen,
      .stage-screen {
        position: relative;
        overflow: hidden;
      }

      .rules-character {
        width: clamp(109px, 24vw, 203px);
      }

      .rules-screen .float-a {
        left: 3%;
        top: 20%;
      }

      .rules-screen .float-b {
        right: 3%;
        top: 24%;
      }

      .rules-screen .float-e {
        left: 7%;
        bottom: 13%;
      }

      .rules-screen .float-f {
        right: 8%;
        bottom: 17%;
      }

      .rules-extra-row {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: clamp(36px, 12vw, 120px);
        width: min(100%, 560px);
        margin: clamp(10px, 2svh, 18px) auto 0;
      }

      .rules-extra-row img {
        width: clamp(126px, 25vw, 217px);
        height: auto;
        filter: drop-shadow(0 8px 10px rgb(166 73 100 / 16%));
      }

      .success-screen {
        position: relative;
      }

      .stage-list {
        display: grid;
        grid-template-columns: repeat(5, minmax(48px, 1fr));
        gap: clamp(8px, 2vw, 16px);
        width: min(100%, 520px);
        margin: clamp(26px, 8svh, 72px) auto 28px;
      }

      .stage-card {
        position: relative;
        display: grid;
        min-height: clamp(56px, 12vw, 76px);
        place-items: center;
        border: 2px solid #e1a7c0;
        border-radius: 18px;
        background:
          linear-gradient(#fffafd, #ffe8f1),
          url("./assets/images/princess_gingham_background.png") center / 120px auto repeat;
        color: #b58296;
        box-shadow: inset 0 2px 2px rgb(255 255 255 / 70%);
        font-size: clamp(23px, 6vw, 36px);
        font-weight: 900;
      }

      .stage-card--active {
        border-color: #df75a2;
        background: linear-gradient(#ffb9d3, #f58ab8);
        color: #fff;
        box-shadow: 0 6px 12px rgb(220 103 152 / 26%), inset 0 2px 0 rgb(255 255 255 / 38%);
        cursor: pointer;
      }

      .stage-card--locked {
        cursor: not-allowed;
      }

      .lock {
        width: clamp(26px, 7vw, 36px);
        height: clamp(26px, 7vw, 36px);
      }

      .coming-soon {
        display: flex;
        width: fit-content;
        margin: 0 auto;
        padding: 9px 18px;
        border: 4px solid #d899b4;
        border-radius: 7px;
        background: #fffafd;
        color: #b58296;
        font-size: clamp(24px, 6vw, 34px);
        font-weight: 900;
        transform: rotate(-7deg);
      }

      .stage-character {
        width: clamp(115px, 25vw, 210px);
      }

      .stage-character--big {
        width: clamp(175px, 32vw, 308px);
      }

      .stage-screen .float-a {
        left: 4%;
        top: 44%;
      }

      .stage-screen .float-b {
        right: 4%;
        top: 44%;
      }

      .stage-screen .float-c {
        left: 17%;
        bottom: 12%;
      }

      .stage-screen .float-d {
        right: 18%;
        bottom: 12%;
      }

      .stage-screen .float-e {
        left: 34%;
        bottom: 7%;
      }

      .stage-screen .float-f {
        right: 43%;
        bottom: 22%;
      }

      .stage-badge {
        display: grid;
        width: 46px;
        height: 42px;
        margin: 6px auto -3px;
        place-items: center;
        border: 2px solid #d985a9;
        border-radius: 12px;
        background:
          linear-gradient(#fffafd, #ffe7f0),
          url("./assets/images/princess_gingham_background.png") center / 100px auto repeat;
        color: var(--ink);
        font-size: 24px;
        font-weight: 900;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
        width: min(100%, 560px);
        margin: 0 auto;
        overflow: hidden;
        border: 4px solid #f0b2cc;
        border-radius: 20px;
        background: #f0b2cc;
        box-shadow: 0 12px 22px rgb(218 104 148 / 18%);
      }

      .play-screen {
        position: relative;
        overflow: hidden;
      }

      .play-helper {
        position: absolute;
        z-index: 0;
        width: clamp(98px, 20vw, 174px);
        pointer-events: none;
        user-select: none;
        filter: drop-shadow(0 8px 10px rgb(166 73 100 / 15%));
        animation: driftThree 7s ease-in-out infinite;
      }

      .play-helper--left {
        left: clamp(8px, 4vw, 34px);
        bottom: clamp(18px, 4svh, 46px);
      }

      .play-helper--right {
        right: clamp(8px, 4vw, 34px);
        bottom: clamp(18px, 4svh, 46px);
        animation-delay: 0.7s;
      }

      .play-screen > :not(.play-helper) {
        position: relative;
        z-index: 1;
      }

      .photo-grid img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #fff3f8;
      }

      .answer-bar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        width: min(100%, 560px);
        margin: 18px auto 0;
      }

      .answer-label {
        font-size: clamp(21px, 5vw, 28px);
        font-weight: 900;
        color: var(--ink);
      }

      .answer-input {
        min-width: 0;
        height: 48px;
        padding: 6px 12px;
        border: 2px solid #d985a9;
        border-radius: 16px;
        background: #fffafd;
        color: var(--ink);
        font-size: clamp(20px, 5vw, 28px);
        font-weight: 900;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 18px;
        visibility: hidden;
        background:
          rgb(255 234 242 / 90%) url("./assets/images/princess_gingham_background.png") center / 360px auto repeat;
        opacity: 0;
        transition: opacity 200ms ease, visibility 200ms ease;
      }

      .modal.is-open {
        visibility: visible;
        opacity: 1;
      }

      .hint-card {
        width: min(92vw, 420px);
        padding: 14px;
        border: 2px solid #e89ab9;
        border-radius: 22px;
        background:
          linear-gradient(rgb(255 250 253 / 88%), rgb(255 241 247 / 88%)),
          url("./assets/images/princess_gingham_background.png") center / 260px auto repeat;
        box-shadow: 0 18px 40px rgb(190 82 124 / 22%);
        transform: scale(0.96);
        transition: transform 200ms ease;
      }

      .modal.is-open .hint-card {
        transform: scale(1);
      }

      .hint-card img {
        width: 100%;
        aspect-ratio: 1 / 1;
        border: 3px solid #efb2cc;
        border-radius: 18px;
        object-fit: cover;
      }

      .hint-copy {
        margin: 12px 0 8px;
        text-align: center;
        font-size: clamp(24px, 7vw, 34px);
        font-weight: 900;
      }

      .hint-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .hint-actions--split {
        justify-content: space-between;
      }

      .hint-second-panel {
        position: relative;
        display: grid;
        min-height: min(70vw, 360px);
        place-items: center;
      }

      .hint-second-panel[hidden] {
        display: none;
      }

      .hint-back {
        position: absolute;
        top: 0;
        left: 0;
      }

      .hint-second-copy {
        margin: 64px 0 18px;
        padding: 0 10px;
        text-align: center;
        font-size: clamp(28px, 8vw, 44px);
        font-weight: 900;
        line-height: 1.25;
      }

      .success-screen {
        overflow: hidden;
        border-color: transparent;
        background:
          linear-gradient(rgb(255 250 253 / 74%), rgb(255 236 244 / 74%)),
          url("./assets/images/princess_gingham_background.png") center / 360px auto repeat;
        box-shadow: none;
      }

      .view--correct {
        background:
          linear-gradient(rgb(255 243 248 / 80%), rgb(255 232 241 / 80%)),
          url("./assets/images/princess_gingham_background.png") center / 360px auto repeat;
        overflow: hidden;
        padding: 8px;
      }

      .view--correct .screen {
        width: min(100%, 980px);
        height: calc(100svh - 16px);
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        padding: 10px clamp(10px, 2vw, 18px);
      }

      .success-content {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        gap: clamp(8px, 1.5svh, 14px);
        place-items: center;
        min-height: 0;
      }

      .correct-side {
        position: absolute;
        z-index: 1;
        width: clamp(82px, 14vw, 142px);
        pointer-events: none;
        user-select: none;
        filter: drop-shadow(0 8px 10px rgb(166 73 100 / 16%));
      }

      .correct-side--top-left {
        left: clamp(12px, 8vw, 120px);
        top: clamp(136px, 20svh, 190px);
      }

      .correct-side--top-right {
        right: clamp(12px, 8vw, 120px);
        top: clamp(136px, 20svh, 190px);
      }

      .correct-side--bottom-left {
        left: clamp(10px, 10vw, 150px);
        bottom: clamp(18px, 8svh, 82px);
      }

      .correct-side--bottom-right {
        right: clamp(10px, 10vw, 150px);
        bottom: clamp(18px, 8svh, 82px);
      }

      .correct-side--middle-left {
        left: clamp(8px, 3vw, 34px);
        top: 68%;
        width: clamp(72px, 13vw, 124px);
      }

      .correct-side--middle-right {
        right: clamp(8px, 3vw, 34px);
        top: 68%;
        width: clamp(72px, 13vw, 124px);
      }

      .success-screen .topbar {
        position: relative;
        z-index: 6;
      }

      .success-title {
        margin: 0;
        text-align: center;
        font-size: clamp(40px, 10svh, 72px);
        font-weight: 900;
        color: var(--red);
        -webkit-text-stroke: 1px #9f4668;
        text-shadow:
          0 4px 0 #fff1ad,
          0 7px 0 #ffa6c6,
          0 13px 20px rgb(190 82 124 / 16%);
      }

      .gif-frame {
        width: min(82vw, 560px);
        height: min(46svh, 500px);
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        mix-blend-mode: multiply;
      }

      .gif-frame img {
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: contain;
        animation: correctPulse 900ms ease-in-out infinite;
      }

      @keyframes correctPulse {
        0%,
        100% {
          transform: scale(0.96);
        }
        50% {
          transform: scale(1.08);
        }
      }

      .answer-check-screen {
        background:
          linear-gradient(rgb(255 250 253 / 82%), rgb(255 241 247 / 82%)),
          url("./assets/images/princess_gingham_background.png") center / 360px auto repeat;
      }

      .answer-check-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        width: min(100%, 620px);
        margin: clamp(36px, 8svh, 70px) auto 0;
      }

            <button class="btn topbar__left" type="button" data-go="stage1">돌아가기</button>
            <div></div>
            <button class="btn topbar__right" type="button" data-go="home">홈</button>
          </header>
          <h2 class="wrong-title">다시 생각해봐요</h2>
          <div class="wrong-gallery">
            <img class="wrong-side" src="./assets/images/wrong_side.png?v=1" alt="" />
            <img class="wrong-main" src="./assets/images/wrong_main.png?v=1" alt="오답 코리락쿠마" />
            <img class="wrong-side" src="./assets/images/wrong_side.png?v=1" alt="" />
          </div>
        </div>
      </section>
    </main>

    <audio id="backgroundAudio" src="./assets/audio/background_music.mp3" preload="auto" loop autoplay></audio>
    <audio id="wrongAudio" src="./assets/audio/wrong_sound.mp3" preload="auto"></audio>

    <div class="modal" id="hintModal" role="dialog" aria-modal="true" aria-labelledby="hintTitle" aria-hidden="true">
      <div class="hint-card">
        <h2 class="sr-only" id="hintTitle">Stage 1 힌트</h2>
        <div class="hint-main-panel" id="hintMainPanel">
          <img id="hintImage" src="./assets/images/stage1_hint.jpg?v=2" alt="Stage 1 힌트 이미지" />
          <p class="hint-copy" id="hintCopy">힌트: 영어</p>
          <div class="hint-actions hint-actions--split">
            <button class="btn" type="button" id="closeHintButton">닫기</button>
            <button class="btn btn--primary" type="button" id="hint2Button" hidden>힌트2</button>
          </div>
        </div>
        <div class="hint-second-panel" id="hintSecondPanel" hidden>
          <button class="btn hint-back" type="button" id="backHintButton">돌아가기</button>
          <p class="hint-second-copy" id="hintSecondCopy">마지막 글자는 '요'에요!</p>
        </div>
      </div>
    </div>

    <script>
      const views = [...document.querySelectorAll(".view")];
      const answerInput = document.querySelector("#answerInput");
      const answerForm = document.querySelector("#answerForm");
      const submitButtons = [...document.querySelectorAll("[data-submit]")];
      const stageButtons = [...document.querySelectorAll("[data-stage]")];
      const stageBadge = document.querySelector("#stageBadge");
      const stagePhotos = [
        document.querySelector("#stagePhoto1"),
        document.querySelector("#stagePhoto2"),
        document.querySelector("#stagePhoto3"),
        document.querySelector("#stagePhoto4"),
      ];
      const answerCheckImages = [
        document.querySelector("#answerCheck1"),
        document.querySelector("#answerCheck2"),
        document.querySelector("#answerCheck3"),
        document.querySelector("#answerCheck4"),
      ];
      const hintModal = document.querySelector("#hintModal");
      const hintTitle = document.querySelector("#hintTitle");
      const hintMainPanel = document.querySelector("#hintMainPanel");
      const hintSecondPanel = document.querySelector("#hintSecondPanel");
      const hintImage = document.querySelector("#hintImage");
      const hintCopy = document.querySelector("#hintCopy");
      const hintButton = document.querySelector("#hintButton");
      const hint2Button = document.querySelector("#hint2Button");
      const backHintButton = document.querySelector("#backHintButton");
      const hintSecondCopy = document.querySelector("#hintSecondCopy");
      const closeHintButton = document.querySelector("#closeHintButton");
      const backgroundAudio = document.querySelector("#backgroundAudio");
      const correctAudio = document.querySelector("#correctAudio");
      const wrongAudio = document.querySelector("#wrongAudio");
      const confettiCanvas = document.querySelector("#confettiCanvas");
      const confettiContext = confettiCanvas.getContext("2d");
      const stages = {
        1: {
          answer: "LOVE",
          inputMode: "latin",
          photos: [
            "./assets/images/stage1_photo1.jpg?v=2",
            "./assets/images/stage1_photo2.jpg?v=2",
            "./assets/images/stage1_photo3.jpg?v=2",
            "./assets/images/stage1_photo4.jpg?v=2",
          ],
          hint: "./assets/images/stage1_hint.jpg?v=2",
          hintLabel: "힌트: 영어",
          answerImages: [
            "./assets/images/answer_1.jpg?v=1",
            "./assets/images/answer_o.jpg?v=1",
            "./assets/images/answer_v.jpg?v=1",
            "./assets/images/answer_e.jpg?v=1",
          ],
        },
        2: {
          answer: "CUTE",
          inputMode: "latin",
          photos: [
            "./assets/images/stage2_photo1.jpg?v=1",
            "./assets/images/stage2_photo2.jpg?v=1",
            "./assets/images/stage2_photo3.jpg?v=1",
            "./assets/images/stage2_photo4.jpg?v=1",
          ],
          hint: "./assets/images/stage2_hint.jpg?v=1",
          hintLabel: "힌트: 영어",
          answerImages: [
            "./assets/images/stage2_answer_1.jpg?v=1",
            "./assets/images/stage2_answer_2.jpg?v=1",
            "./assets/images/stage2_answer_3.jpg?v=1",
            "./assets/images/stage2_answer_4.jpg?v=1",
          ],
        },
        3: {
          answer: "사랑해요",
          inputMode: "text",
          photos: [
            "./assets/images/stage3_photo1.jpg?v=1",
            "./assets/images/stage3_photo2.jpg?v=1",
            "./assets/images/stage3_photo3.jpg?v=1",
            "./assets/images/stage3_photo4.jpg?v=1",
          ],
          hint: "./assets/images/stage3_hint.jpg?v=1",
          hintLabel: "힌트: 한글",
          hint2: "마지막 글자는 '요'에요!",
          answerImages: [
            "./assets/images/stage3_answer_1.jpg?v=1",
            "./assets/images/stage3_answer_2.jpg?v=1",
            "./assets/images/stage3_answer_3.jpg?v=1",
            "./assets/images/stage3_answer_4.jpg?v=1",
          ],
        },
      };
      let activeView = "home";
      let currentStage = 1;
      let audioUnlocked = true;
      let confettiPieces = [];
      let confettiAnimationId = 0;

      function setView(viewName) {
        activeView = viewName;

        views.forEach((view) => {
          const isActive = view.dataset.view === viewName;
          view.classList.toggle("is-active", isActive);
          view.setAttribute("aria-hidden", String(!isActive));
        });

        if (viewName === "home") {
          answerInput.value = "";
          syncSubmitState();
        }

        pauseWrongAudio();

        if (viewName === "correct") {
          pauseBackgroundAudio();
          startConfetti();
          playCorrectAudio();
          return;
        }

        stopConfetti();
        pauseCorrectAudio();

        if (viewName === "wrong") {
          pauseBackgroundAudio();
          playWrongAudio();
          return;
        }

        playBackgroundAudio();
      }

      function setStage(stageNumber) {
        const stage = stages[stageNumber];
        if (!stage) return;

        currentStage = stageNumber;
        stageBadge.textContent = String(stageNumber);
        stagePhotos.forEach((image, index) => {
          image.src = stage.photos[index];
          image.alt = `Stage ${stageNumber} 단서 사진 ${index + 1}`;
        });
        answerCheckImages.forEach((image, index) => {
          image.src = stage.answerImages[index];
          image.alt = `Stage ${stageNumber} 정답 확인 사진 ${index + 1}`;
        });
        hintImage.src = stage.hint;
        hintImage.alt = `Stage ${stageNumber} 힌트 이미지`;
        hintCopy.textContent = stage.hintLabel || "힌트";
        hintTitle.textContent = `Stage ${stageNumber} 힌트`;
        hintSecondCopy.textContent = stage.hint2 || "";
        hint2Button.hidden = !stage.hint2;
        answerInput.inputMode = stage.inputMode || "text";
        showMainHintPanel();
        answerInput.value = "";
        syncSubmitState();
      }

      function syncSubmitState() {
        const hasAnswer = answerInput.value.trim().length > 0;
        submitButtons.forEach((button) => {
          button.disabled = !hasAnswer;
        });
      }

      function submitAnswer() {
        if (!answerInput.value.trim()) return;

        const normalizedAnswer = answerInput.value.trim().toUpperCase();
        setView(normalizedAnswer === stages[currentStage].answer ? "correct" : "wrong");
      }

      function openHint() {
        showMainHintPanel();
        hintModal.classList.add("is-open");
        hintModal.setAttribute("aria-hidden", "false");
        closeHintButton.focus();
      }

      function showMainHintPanel() {
        hintMainPanel.hidden = false;
        hintSecondPanel.hidden = true;
      }

      function showSecondHintPanel() {
        hintMainPanel.hidden = true;
        hintSecondPanel.hidden = false;
        backHintButton.focus();
      }

      function closeHint() {
        hintModal.classList.remove("is-open");
        hintModal.setAttribute("aria-hidden", "true");
        showMainHintPanel();
        hintButton.focus();
      }

      function playBackgroundAudio() {
        if (!audioUnlocked || !backgroundAudio || activeView === "correct" || activeView === "wrong") return Promise.resolve();

        backgroundAudio.volume = 0.38;
        return backgroundAudio.play().catch(() => {});
      }

      function pauseBackgroundAudio() {
        if (!backgroundAudio) return;

        backgroundAudio.pause();
      }

      function unlockAndPlayBackgroundAudio() {
        audioUnlocked = true;
        playBackgroundAudio();
      }

      function playCorrectAudio() {
        correctAudio.currentTime = 0;
        correctAudio.play().catch(() => {
          // Mobile browsers may require the user's next tap before audio can play.
        });
      }

      function pauseCorrectAudio() {
        correctAudio.pause();
        correctAudio.currentTime = 0;
      }

      function playWrongAudio() {
        if (!wrongAudio) return;

        wrongAudio.currentTime = 0;
        wrongAudio.play().catch(() => {});
      }

      function pauseWrongAudio() {
        if (!wrongAudio) return;

        wrongAudio.pause();
        wrongAudio.currentTime = 0;
      }

      function resizeConfettiCanvas() {
        const rect = confettiCanvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        confettiCanvas.width = Math.max(1, Math.floor(rect.width * ratio));
        confettiCanvas.height = Math.max(1, Math.floor(rect.height * ratio));
        confettiContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function createConfettiPieces() {
        const rect = confettiCanvas.getBoundingClientRect();
        const colors = ["#f58ab8", "#fff2ac", "#ff7fae", "#f3b4cf", "#b6dc80"];

        confettiPieces = Array.from({ length: 120 }, () => ({
          x: Math.random() * rect.width,
          y: Math.random() * -rect.height,
          width: 6 + Math.random() * 8,
          height: 10 + Math.random() * 12,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: 1.8 + Math.random() * 3.2,
          drift: -1.4 + Math.random() * 2.8,
          rotation: Math.random() * Math.PI,
          rotationSpeed: -0.08 + Math.random() * 0.16,
        }));
      }

      function drawConfetti() {
        const rect = confettiCanvas.getBoundingClientRect();
        confettiContext.clearRect(0, 0, rect.width, rect.height);

        confettiPieces.forEach((piece) => {
          piece.y += piece.speed;
          piece.x += piece.drift;
          piece.rotation += piece.rotationSpeed;

          if (piece.y > rect.height + 20) {
            piece.y = -20;
            piece.x = Math.random() * rect.width;
          }

          confettiContext.save();
          confettiContext.translate(piece.x, piece.y);
          confettiContext.rotate(piece.rotation);
          confettiContext.fillStyle = piece.color;
          confettiContext.fillRect(-piece.width / 2, -piece.height / 2, piece.width, piece.height);
          confettiContext.restore();
        });

        confettiAnimationId = requestAnimationFrame(drawConfetti);
      }

      function startConfetti() {
        stopConfetti();
        resizeConfettiCanvas();
        createConfettiPieces();
        drawConfetti();
      }

      function stopConfetti() {
        cancelAnimationFrame(confettiAnimationId);
        confettiContext.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }

      document.addEventListener("click", (event) => {
        unlockAndPlayBackgroundAudio();
        const routeButton = event.target.closest("[data-go]");
        const submitButton = event.target.closest("[data-submit]");
        const stageButton = event.target.closest("[data-stage]");

        if (stageButton) {
          setStage(Number(stageButton.dataset.stage));
          setView("stage1");
          return;
        }

        if (routeButton) {
          setView(routeButton.dataset.go);
        }

        if (submitButton && submitButton.type !== "submit") {
          submitAnswer();
        }

        playBackgroundAudio();
      });

      document.addEventListener("pointerdown", unlockAndPlayBackgroundAudio, { once: true });
      document.addEventListener("keydown", unlockAndPlayBackgroundAudio, { once: true });
      window.addEventListener("load", () => {
        playBackgroundAudio();
      });

      answerInput.addEventListener("input", syncSubmitState);

      answerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        submitAnswer();
      });

      hintButton.addEventListener("click", openHint);
      closeHintButton.addEventListener("click", closeHint);
      hint2Button.addEventListener("click", showSecondHintPanel);
      backHintButton.addEventListener("click", showMainHintPanel);

      hintModal.addEventListener("click", (event) => {
        if (event.target === hintModal) closeHint();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && hintModal.classList.contains("is-open")) {
          closeHint();
        }
      });

      window.addEventListener("resize", () => {
        if (activeView === "correct") {
          resizeConfettiCanvas();
          createConfettiPieces();
        }
      });

      setStage(1);
      syncSubmitState();
    </script>
  </body>
</html>
